name: CI Pipeline
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # pobranie kodu z repo
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        run: mvn clean verify -B

      - name: Generate coverage report
        run: mvn jacoco:report

      # Test smoke
      - name: Run smoke test with example input
        run: |
          java -jar target/simulation-1.0-jar-with-dependencies.jar \
            example/input.json /tmp/output.json
          cat /tmp/output.json
          # Sprawdź czy output zawiera "stepStatuses"
          grep -q "stepStatuses" /tmp/output.json && echo "✅ Smoke test passed"

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test   # uruchom po testach

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t traffic-simulation:${{ github.sha }} .

      - name: Test Docker image
        run: |
          docker run \
            -v ${{ github.workspace }}/example:/data \
            traffic-simulation:${{ github.sha }} \
            /data/input.json /data/output.json
          cat example/output.json